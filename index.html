<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BrowserBabyAlarm</title>
<!-- Pin versions. For production, self-host these files (or cache them with a service worker) and add SRI hashes. -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#020617;--card:#0f172a;--line:#1e293b;--fg:#f1f5f9;--mut:#a3b1c6;--ok:#34d399;--warn:#fbbf24;--bad:#f43f5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
main{flex:1;width:100%;max-width:900px;margin:0 auto;padding:16px}
h2,h3,p{margin:.3em 0}
.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
button,select,input{font:inherit;color:inherit}
button{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:10px 12px;cursor:pointer}
button:hover{background:#334155}button.p{background:#4f46e5;border-color:#6366f1}
button.big{text-align:left;color:var(--fg);min-height:150px}
button.on{background:#4f46e5}
select,input[type=text],input:not([type]){background:#020617;border:1px solid #334155;border-radius:10px;padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mut{color:var(--mut);font-size:13px}.mono{font-family:ui-monospace,monospace;letter-spacing:.1em}
.badge{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:#1e293b;border:1px solid #334155;font-size:12px}
.badge.bad{border-color:var(--bad);color:#fecdd3}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;object-fit:cover;display:block}
.bar{height:14px;background:#1e293b;border-radius:8px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.bar b{position:absolute;top:0;bottom:0;width:3px;background:var(--bad)}
.frame{position:relative;border:2px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.frame video{border-radius:0}
.cover{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px;background:rgba(76,5,25,.92)}
.tr{position:absolute;top:10px;right:10px;z-index:4}
.bt{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,23,42,.85);padding:10px;border-radius:12px;z-index:3}
.spread{justify-content:space-between;flex-wrap:nowrap}
.ab{position:absolute;top:10px;left:10px;z-index:6;background:var(--warn);color:#000}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#dimOv{z-index:60}
@keyframes pl{50%{background:rgba(244,63,94,.35)}}
.alert{animation:pl .8s infinite;border-color:var(--bad)}
#ptt{touch-action:none;user-select:none}
footer{padding:12px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <div><b>BrowserBabyAlarm</b><div class="mut" data-i="sub"></div></div>
  <div class="row">
    <select id="lang" aria-label="Language"><option value="da">DA</option><option value="en">EN</option></select>
    <span class="badge"><i id="dot" class="dot"></i><span id="st" aria-live="polite"></span></span>
  </div>
</header>
<main>
  <div id="note" class="card row hide" role="alert"><span id="nt" style="flex:1"></span><button id="nx" aria-label="Close">✕</button></div>

  <section id="roleView">
    <h2 data-i="pick"></h2><p class="mut" data-i="pickD"></p>
    <div class="grid g2" style="margin-top:12px">
      <button class="big" id="bBtn"><h3>📹 <span data-i="baby"></span></h3><p class="mut" data-i="babyD"></p></button>
      <button class="big" id="pBtn"><h3>🖥️ <span data-i="parent"></span></h3><p class="mut" data-i="parentD"></p></button>
    </div>
    <p class="card mut" data-i="priv"></p>
  </section>

  <section id="babyView" class="hide">
    <div id="nightOv" class="ov hide" style="background:#fcd34d;color:#451a03">
      <div class="row">
        <button class="nc" data-c="#fcd34d" data-f="#451a03" data-i="cA"></button>
        <button class="nc" data-c="#7f1d1d" data-f="#fecaca" data-i="cR"></button>
        <button class="nc" data-c="#1e1b4b" data-f="#c7d2fe" data-i="cB"></button>
      </div>
      <button id="nOff" class="p" data-i="nightOff"></button>
    </div>
    <div id="dimOv" class="ov hide" style="background:#000;color:#222;cursor:pointer" data-i="dimTip"></div>

    <div id="permCard" class="card"><h3 data-i="permT"></h3><p class="mut" data-i="permD"></p><button id="grant" class="p" data-i="permB"></button></div>
    <div id="pairCard" class="card hide" style="text-align:center">
      <p class="mut" data-i="scan"></p>
      <div id="qr" style="background:#fff;padding:10px;border-radius:10px;display:inline-block;min-width:170px;min-height:170px"></div>
      <div class="row" style="justify-content:center;margin-top:8px">
        <span class="mut" data-i="codeL"></span><b id="code" class="mono"></b>
        <button id="cp" data-i="copy"></button><button id="nc2" data-i="newCode"></button>
      </div>
    </div>
    <video id="prev" autoplay playsinline muted></video>
    <div class="bar" style="margin:10px 0"><i id="mbar"></i></div>
    <div class="grid">
      <button id="bFlip" data-i="flip"></button><button id="bNight" data-i="night"></button><button id="bDim" data-i="dim"></button>
    </div>
    <div class="card row">
      <span data-i="snd"></span><select id="snd"></select>
      <span id="batBox" class="row"><span data-i="bat"></span><select id="batSel"></select></span>
    </div>
    <audio id="ic" autoplay playsinline></audio>
  </section>

  <section id="parentView" class="hide">
    <div id="joinCard" class="card" style="max-width:420px;margin:auto">
      <h3 data-i="joinT"></h3><p class="mut" data-i="joinD"></p>
      <div class="row"><input id="inp" class="mono" maxlength="11" autocomplete="off" autocapitalize="characters" style="flex:1"><button id="go" class="p" data-i="conn"></button></div>
    </div>
    <div id="streamBox" class="hide">
      <div id="frame" class="frame">
        <video id="rv" autoplay playsinline muted></video>
        <div id="vwait" class="cover hide" style="background:rgba(2,6,23,.92);cursor:pointer"><p id="vmsg"></p></div>
        <button id="unlock" class="ab hide" data-i="unlock"></button>
        <div id="lost" class="cover hide"><h2 data-i="lostT"></h2><p data-i="lostD"></p></div>
        <div id="alarm" class="cover hide"><h2 data-i="alT"></h2><p data-i="alD"></p><button id="dis" class="p" data-i="dis"></button></div>
        <div class="tr row">
          <span id="iceB" class="badge">ICE: –</span><span id="rbat" class="badge">--</span><span id="bN" class="badge hide">☀️</span><span id="bD" class="badge hide">🌑</span><span id="bS" class="badge hide">🎵</span>
          <button id="fs" aria-label="Fullscreen">⛶</button>
        </div>
        <div class="bt">
          <div class="row spread mut"><span data-i="mic"></span><b id="plv" class="mono">0%</b></div>
          <div class="bar"><i id="pbar"></i><b id="tm" style="left:35%"></b></div>
        </div>
      </div>
      <div class="grid g2">
        <div class="card">
          <div class="row spread"><b data-i="boost"></b><span id="gv" class="mono">150%</span></div>
          <input type="range" id="gain" min="0" max="400" value="150" style="width:100%" aria-label="Volume">
          <button id="mute" style="width:100%"></button>
        </div>
        <div class="card">
          <div class="row spread"><b data-i="vox"></b><span id="tv" class="mono">35%</span></div>
          <input type="range" id="thr" min="5" max="95" value="35" style="width:100%" aria-label="Threshold">
          <p class="mut" data-i="voxD"></p>
          <label class="row"><input type="checkbox" id="beep" checked><span data-i="beepL"></span></label>
        </div>
        <div class="card">
          <b data-i="remote"></b>
          <div class="grid" style="margin:8px 0"><button id="rN" aria-label="Nightlight">☀️</button><button id="rD" aria-label="Dim screen">🌑</button><button id="rF" aria-label="Flip camera">🔄</button></div>
          <select id="rsnd" style="width:100%;margin-bottom:8px"></select>
          <button id="ptt" style="width:100%" data-i="ptt"></button>
        </div>
      </div>
      <p class="card mut"><span data-i="last"></span> <b id="last" style="color:var(--fg)"></b></p>
    </div>
  </section>
</main>
<footer>BrowserBabyAlarm &bull; WebRTC</footer>

<script>
'use strict';
/* ---------- i18n ---------- */
const D={
da:{sub:'P2P babyalarm i browseren',pick:'Vælg enhedstype',pickD:'Begge enheder åbner siden i en browser (HTTPS).',baby:'Baby-enhed',babyD:'Telefonen på babyens værelse. Streamer video og lyd.',parent:'Forældre-enhed',parentD:'Enheden du lytter på og modtager alarmer på.',
priv:'Privatliv: Video og lyd sendes krypteret direkte mellem enhederne (WebRTC). Forbindelsen opsættes via PeerJS- og Google-servere, som kan se IP-adresser. Kun enheder med din private kode kan forbinde, og kun én forælder ad gangen.',
permT:'Tilladelse påkrævet',permD:'Browseren skal bruge kamera og mikrofon.',permB:'Giv adgang',scan:'Scan QR-koden på forældre-enheden, eller indtast koden:',codeL:'Kode:',copy:'Kopiér',newCode:'Ny kode',
flip:'Vend kamera',night:'Natlys',dim:'Sort skærm',nightOff:'Sluk natlys',dimTip:'Tryk for at vække skærmen',cA:'Rav',cR:'Rød',cB:'Blå',snd:'Lyd:',bat:'Batteri:',bC:'Oplader ⚡',
s_off:'Slukket',s_womb:'Livmoder (brun støj)',s_rain:'Regn',s_waves:'Havbølger',s_heart:'Hjerteslag',s_lull:'Vuggevise',
joinT:'Forbind til baby-enhed',joinD:'Indtast koden fra babyens telefon:',conn:'Forbind',lostT:'FORBINDELSE MISTET!',lostD:'Telefonen har mistet netværket, eller siden blev lukket. Prøver automatisk igen…',
alT:'LYD OVER GRÆNSEN!',alD:'Der er registreret vedvarende lyd på babyværelset.',dis:'Afvis',mic:'Lyd fra babyværelset:',boost:'Lydstyrke / boost',spkOn:'🔊 Højttaler tændt',spkOff:'🔇 Højttaler slukket',
vox:'Gråde-tærskel',voxD:'Alarm ved vedvarende lyd over den røde streg.',beepL:'Bip ved alarm',remote:'Fjernstyring',ptt:'Hold for at tale',pttOn:'Taler…',last:'Seneste hændelse:',none:'Ingen endnu',unlock:'Tryk for at aktivere lyd',
stIdle:'Vælg enhed',stWait:'Afventer kamera',stReq:'Anmoder om kamera…',stReady:'Klar til parring',stParent:'Forælder tilsluttet',stDenied:'Adgang afvist',stCalling:'Forbinder…',stLive:'Live',stLost:'Forbindelse mistet',stErr:'Fejl',
denied:'Kunne ikke få adgang til kamera/mikrofon.',https:'Siden kører ikke over HTTPS – kamera og mikrofon virker ikke.',badCode:'Ugyldig kode.',nf:'Baby-enheden blev ikke fundet.',to:'Timeout – prøv igen.',lowBat:'Babytelefonens batteri er lavt!',vWait:'Venter på video…',vNo:'Ingen video endnu. Tryk for at prøve igen. Forbindelsestilstand:'},
en:{sub:'P2P browser baby monitor',pick:'Select device type',pickD:'Both devices open this page in a browser (HTTPS).',baby:'Baby device',babyD:"The phone in the baby's room. Streams video and audio.",parent:'Parent device',parentD:'The device you listen on and get alerts on.',
priv:'Privacy: Video and audio go encrypted directly between devices (WebRTC). The connection is set up via PeerJS and Google servers, which can see IP addresses. Only devices with your private code can connect, one parent at a time.',
permT:'Permission required',permD:'The browser needs camera and microphone access.',permB:'Grant access',scan:'Scan the QR code on the parent device, or enter the code:',codeL:'Code:',copy:'Copy',newCode:'New code',
flip:'Flip camera',night:'Nightlight',dim:'Black screen',nightOff:'Turn off nightlight',dimTip:'Tap to wake the screen',cA:'Amber',cR:'Red',cB:'Blue',snd:'Sound:',bat:'Battery:',bC:'Charging ⚡',
s_off:'Off',s_womb:'Womb (brown noise)',s_rain:'Rain',s_waves:'Ocean waves',s_heart:'Heartbeat',s_lull:'Lullaby',
joinT:'Connect to baby device',joinD:"Enter the code shown on the baby's phone:",conn:'Connect',lostT:'CONNECTION LOST!',lostD:'The phone lost its network or the page was closed. Retrying automatically…',
alT:'NOISE OVER LIMIT!',alD:"Sustained noise detected in the baby's room.",dis:'Dismiss',mic:"Sound from baby's room:",boost:'Volume / boost',spkOn:'🔊 Speaker on',spkOff:'🔇 Speaker off',
vox:'Cry threshold',voxD:'Alarm on sustained sound above the red line.',beepL:'Beep on alarm',remote:'Remote control',ptt:'Hold to talk',pttOn:'Talking…',last:'Last event:',none:'None yet',unlock:'Tap to enable audio',
stIdle:'Choose device',stWait:'Waiting for camera',stReq:'Requesting camera…',stReady:'Ready to pair',stParent:'Parent connected',stDenied:'Access denied',stCalling:'Connecting…',stLive:'Live',stLost:'Connection lost',stErr:'Error',
denied:'Could not access camera/microphone.',https:'Page is not served over HTTPS – camera and microphone will not work.',badCode:'Invalid code.',nf:'Baby device not found.',to:'Timeout – try again.',lowBat:"Baby phone's battery is low!",vWait:'Waiting for video…',vNo:'No video yet. Tap to retry. Connection state:'}
};
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('bba-lang')||(navigator.language.startsWith('da')?'da':'en');
const t=k=>D[lang][k]||k;
function applyLang(){
  document.documentElement.lang=lang;$('lang').value=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  updateMute();if(!lastSet)$('last').textContent=t('none');
}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('bba-lang',lang);applyLang()};

/* ---------- helpers ---------- */
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}
  /* Add a TURN server for CGNAT / mobile data / client-isolated Wi-Fi, e.g. {urls:'turn:turn.example.com:3478',username:'u',credential:'p'} */];
const SOUNDS=['off','womb','rain','waves','heart','lull'];
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(x=>ALPH[x%ALPH.length]).join('');
const norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
const pid=c=>'bba-'+norm(c);
const send=(c,m)=>{try{if(c&&c.open)c.send(m)}catch(e){}};
let role=null,peer=null,actx=null,lastSet=false,noteT;
const ensureAudio=()=>{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume().catch(()=>{});return actx};
function show(v){role=v;['roleView','babyView','parentView'].forEach(id=>$(id).classList.toggle('hide',id!==v+'View'))}
function setStatus(txt,c){$('st').textContent=txt;$('dot').style.background='var(--'+c+')'}
function note(txt,type){
  const n=$('note');n.classList.remove('hide');$('nt').textContent=txt;
  n.style.borderColor=type==='bad'?'var(--bad)':type==='ok'?'var(--ok)':'#334155';
  clearTimeout(noteT);if(type!=='bad')noteT=setTimeout(()=>n.classList.add('hide'),6000);
}
$('nx').onclick=()=>$('note').classList.add('hide');
function beep(a,b,v,type){
  try{const c=ensureAudio(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime;
    o.type=type||'sine';o.frequency.setValueAtTime(a,n);o.frequency.setValueAtTime(b,n+.15);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+.45);
    o.connect(g);g.connect(c.destination);o.start();o.stop(n+.45)}catch(e){}
}
function notify(txt){try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification('BrowserBabyAlarm',{body:txt})}catch(e){}}
let wl=null;
async function wake(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&role==='baby'&&stream)wake()});

/* populate selects */
['snd','rsnd'].forEach(id=>SOUNDS.forEach(s=>{const o=new Option('',s);o.dataset.i='s_'+s;$(id).add(o)}));
[['c','bC'],['100'],['80'],['60'],['40'],['20'],['10']].forEach(([v,k])=>{const o=new Option(k?'':'~'+v+'%',v);if(k)o.dataset.i=k;$('batSel').add(o)});

/* ---------- BABY ---------- */
let stream=null,audioTrack=null,videoTrack=null,facing='environment',parentId=null,lastSeen=0,bconn=null,bcall=null;
let night=false,dim=false,sound='off',bat={l:100,c:false,e:true},level=0;
$('bBtn').onclick=()=>{show('baby');setStatus(t('stWait'),'warn');initBattery();if(!window.isSecureContext)note(t('https'),'bad')};
$('grant').onclick=grant;
async function setVideo(){
  if(videoTrack)videoTrack.stop();   // release first: many phones can't open two cameras
  const v=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
  videoTrack=v.getVideoTracks()[0];
  stream=new MediaStream([audioTrack,videoTrack]);
  $('prev').srcObject=stream;
  const s=bcall&&bcall.peerConnection&&bcall.peerConnection.getSenders().find(x=>x.track&&x.track.kind==='video');
  if(s)await s.replaceTrack(videoTrack);
}
async function grant(){
  try{
    setStatus(t('stReq'),'warn');
    if(!audioTrack||audioTrack.readyState!=='live'){
      const a=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
      audioTrack=a.getAudioTracks()[0];startMeter(a);
    }
    await setVideo();
    $('permCard').classList.add('hide');$('pairCard').classList.remove('hide');
    wake();if(!peer)initBabyPeer();
  }catch(e){note(t('denied'),'bad');setStatus(t('stDenied'),'bad')}
}
function startMeter(a){   // single meter loop; setInterval keeps running when the tab is capturing media
  const c=new (window.AudioContext||window.webkitAudioContext)();c.resume();
  const an=c.createAnalyser();an.fftSize=512;c.createMediaStreamSource(a).connect(an);
  const d=new Uint8Array(512);
  setInterval(()=>{
    an.getByteTimeDomainData(d);let s=0;for(const x of d){const n=(x-128)/128;s+=n*n}
    level=Math.min(100,Math.round(Math.sqrt(s/d.length)*320));
    $('mbar').style.width=level+'%';send(bconn,{type:'lvl',v:level});
  },100);
}
function claim(p){   // only one parent at a time; a new one may take over once the old one has been silent for 8 s
  if(!parentId||parentId===p||Date.now()-lastSeen>8000){parentId=p;lastSeen=Date.now();return true}
  return false;
}
function initBabyPeer(){
  let code=localStorage.getItem('bba-code');
  if(!code){code=rnd(10);localStorage.setItem('bba-code',code)}
  peer=new Peer(pid(code),{config:{iceServers:ICE}});
  peer.on('open',()=>{
    $('code').textContent=code.slice(0,5)+'-'+code.slice(5);setStatus(t('stReady'),'ok');
    $('qr').innerHTML='';new QRCode($('qr'),{text:location.origin+location.pathname+'#join='+code,width:150,height:150});
  });
  peer.on('call',c=>{
    if(c.metadata&&c.metadata.type==='intercom'){
      if(c.peer!==parentId)return c.close();
      c.answer();c.on('stream',s=>{$('ic').srcObject=s;$('ic').play().catch(()=>{})});return;
    }
    if(!claim(c.peer))return c.close();
    if(bcall&&bcall!==c)try{bcall.close()}catch(e){}
    bcall=c;c.answer(stream);setStatus(t('stParent'),'ok');note(t('stParent'),'ok');
    c.on('close',()=>{if(bcall===c)bcall=null});
  });
  peer.on('connection',c=>{
    if(!claim(c.peer))return c.close();
    if(bconn&&bconn!==c)try{bconn.close()}catch(e){}
    bconn=c;c.on('open',syncState);
    c.on('data',m=>{
      if(c!==bconn||!m)return;lastSeen=Date.now();
      if(m.type==='ping')send(c,{type:'pong'});else command(m);
    });
    c.on('close',()=>{if(bconn===c)bconn=null});
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id')setTimeout(()=>{peer.destroy();peer=null;initBabyPeer()},3000);   // old session still registered
    else if(e.type!=='peer-unavailable')note('Peer: '+e.type,'bad');
  });
  peer.on('disconnected',()=>{if(!peer.destroyed)setTimeout(()=>peer.reconnect(),2000)});
}
$('nc2').onclick=()=>{
  localStorage.removeItem('bba-code');parentId=null;
  [bcall,bconn].forEach(x=>{try{x&&x.close()}catch(e){}});
  if(peer)peer.destroy();peer=null;initBabyPeer();
};
$('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('code').textContent).catch(()=>{});
function syncState(){send(bconn,{type:'st',night,dim,sound,bat:{l:Math.round(bat.l),c:bat.c,e:bat.e}})}
function command(m){   // whitelist only
  if(m.a==='night')setNight(!night);else if(m.a==='dim')setDim(!dim);else if(m.a==='flip')flip();
  else if(m.a==='sound'&&SOUNDS.includes(m.v))setSound(m.v);
}
function ov(){$('nightOv').classList.toggle('hide',!night);$('dimOv').classList.toggle('hide',!dim);syncState()}
function setNight(on){night=on;if(on)dim=false;ov()}
function setDim(on){dim=on;if(on)night=false;ov()}
async function flip(){facing=facing==='user'?'environment':'user';try{await setVideo()}catch(e){note(t('denied'),'bad')}}
$('bFlip').onclick=flip;$('bNight').onclick=()=>setNight(!night);$('bDim').onclick=()=>setDim(!dim);
$('nOff').onclick=()=>setNight(false);$('dimOv').onclick=()=>setDim(false);
document.querySelectorAll('.nc').forEach(b=>b.onclick=()=>{$('nightOv').style.background=b.dataset.c;$('nightOv').style.color=b.dataset.f});
$('snd').onchange=e=>setSound(e.target.value);

/* battery */
async function initBattery(){
  try{
    const b=await navigator.getBattery();$('batBox').classList.add('hide');
    const u=()=>{bat={l:Math.round(b.level*100),c:b.charging,e:false};syncState()};
    u();b.onlevelchange=u;b.onchargingchange=u;return;
  }catch(e){}
  $('batSel').onchange=e=>{const v=e.target.value;bat={l:v==='c'?100:+v,c:v==='c',e:true};syncState()};
  $('batSel').value='100';$('batSel').onchange({target:$('batSel')});
}

/* sleep sounds */
let snodes=[],stimers=[];
const every=(f,ms)=>{f();stimers.push(setInterval(f,ms))};
function noiseBuf(c,k){
  const n=3*c.sampleRate,b=c.createBuffer(1,n,c.sampleRate),o=b.getChannelData(0);let l=0,m=0;
  for(let i=0;i<n;i++){l=(l+k*(Math.random()*2-1))/(1+k);o[i]=l;m=Math.max(m,Math.abs(l))}
  for(let i=0;i<n;i++)o[i]/=m;return b;
}
function loop(c,k,f,v){
  const s=c.createBufferSource();s.buffer=noiseBuf(c,k);s.loop=true;
  const fl=c.createBiquadFilter();fl.frequency.value=f;const g=c.createGain();g.gain.value=v;
  s.connect(fl);fl.connect(g);g.connect(c.destination);s.start();snodes.push(s);return g;
}
function blip(c,f,f2,v,o,d){
  const t0=c.currentTime+o,os=c.createOscillator(),g=c.createGain();
  os.frequency.setValueAtTime(f,t0);os.frequency.exponentialRampToValueAtTime(f2,t0+d*.8);
  g.gain.setValueAtTime(.001,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  os.connect(g);g.connect(c.destination);os.start(t0);os.stop(t0+d+.05);
}
function setSound(m){
  stimers.forEach(clearInterval);stimers=[];snodes.forEach(n=>{try{n.stop()}catch(e){}});snodes=[];
  sound=m;$('snd').value=m;
  if(m!=='off'){
    const c=ensureAudio();
    if(m==='womb')loop(c,.02,420,.5);
    else if(m==='rain')loop(c,.3,2500,.2);
    else if(m==='waves'){const g=loop(c,.04,600,.2),l=c.createOscillator(),lg=c.createGain();l.frequency.value=.1;lg.gain.value=.15;l.connect(lg);lg.connect(g.gain);l.start();snodes.push(l)}
    else if(m==='heart')every(()=>{blip(c,65,30,.35,0,.22);blip(c,52,30,.22,.28,.22)},1000);
    else{const n=[261.63,329.63,392,329.63,440,392,329.63,293.66,349.23,293.66,261.63,261.63];let i=0;every(()=>{const f=n[i++%n.length];blip(c,f,f,.08,0,1.4)},900)}
  }
  syncState();
}

/* ---------- PARENT ---------- */
let ice='new',callAt=0,videoOk=false;
let target=null,pcall=null,pconn=null,rStream=null,lastHb=0,lost=false,hb=null,lastTry=0,connecting=false,lostT=null;
let pump=null,src=null,an=null,gn=null,comp=null,loopOn=false,dummyS=null;
let gain=150,muted=false,thr=35,rLevel=0,lvAt=0,alarmOn=false,alarmT=null,alarmN=0,lowShown=false,pttS=null,pttC=null;
const td=new Uint8Array(512),hist=[];
const hashM=location.hash.match(/join=([A-Za-z0-9]+)/),joinCode=hashM?norm(hashM[1]):'';
if(hashM)history.replaceState(null,'',location.pathname);   // keep the secret out of history

$('pBtn').onclick=startParent;
function startParent(){
  show('parent');setStatus(t('stIdle'),'mut');
  peer=new Peer({config:{iceServers:ICE}});
  peer.on('open',()=>{if(joinCode&&!target){$('inp').value=joinCode.slice(0,5)+'-'+joinCode.slice(5);connect()}});
  peer.on('error',e=>{
    busy(false);
    if(e.type==='peer-unavailable'){if(!lost)note(t('nf'),'bad')}else note('Peer: '+e.type,'bad');
    if(!lost)setStatus(t('stErr'),'bad');
  });
  peer.on('disconnected',()=>{if(!peer.destroyed)setTimeout(()=>peer.reconnect(),2000)});
}
function busy(b){connecting=b;$('go').disabled=b;$('go').style.opacity=b?.6:1}
function dummy(){   // PeerJS needs a local stream so the offer contains audio+video sections
  if(!dummyS){
    const cv=document.createElement('canvas');cv.width=cv.height=16;cv.getContext('2d').fillRect(0,0,16,16);
    const d=ensureAudio().createMediaStreamDestination();
    dummyS=new MediaStream([...cv.captureStream(1).getVideoTracks(),...d.stream.getAudioTracks()]);
  }
  return dummyS;
}
$('go').onclick=connect;
$('inp').onkeydown=e=>{if(e.key==='Enter')connect()};
async function connect(){
  const code=norm($('inp').value);
  if(code.length!==10||!peer||!peer.open)return note(t('badCode'),'bad');
  target=pid(code);busy(true);setStatus(t('stCalling'),'warn');ensureAudio();
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});
  // Granting mic permission lets the browser expose real LAN addresses instead of mDNS names (helps phone-to-phone on Wi-Fi)
  try{const m=await navigator.mediaDevices.getUserMedia({audio:true});m.getTracks().forEach(x=>x.stop())}catch(e){}
  dial();
  setTimeout(()=>{if(connecting){busy(false);note(t('to'),'bad');setStatus(t('stErr'),'bad')}},12000);
}
function dial(keep){   // keep=true: only redo the media call, leave a healthy data connection alone
  const old=pcall,oc=keep?null:pconn;pcall=null;if(!keep)pconn=null;
  try{old&&old.close()}catch(e){}try{oc&&oc.close()}catch(e){}
  const c=peer.call(target,dummy());pcall=c;callAt=Date.now();videoOk=false;ice='new';watchIce(c);
  if(!keep){
    const dc=peer.connect(target,{reliable:true});pconn=dc;
    dc.on('open',()=>{lastHb=Date.now()});
    dc.on('data',onData);
  }
  c.on('stream',s=>{
    if(pcall!==c)return;
    busy(false);rStream=s;lastHb=Date.now();setLost(false);setStatus(t('stLive'),'ok');
    $('joinCard').classList.add('hide');$('streamBox').classList.remove('hide');
    const v=$('rv');v.srcObject=s;v.muted=true;v.play().catch(()=>{});
    ['playing','resize','loadedmetadata'].forEach(ev=>v.addEventListener(ev,chk));
    if(!videoOk){$('vwait').classList.remove('hide');$('vmsg').textContent=t('vWait')}
    watchIce(c);wire(s);startHb();
  });
  c.on('close',()=>{if(pcall===c&&!lost)setLost(true)});
}
function watchIce(c){
  const q=c.peerConnection;if(!q||c._w)return;c._w=1;ice=q.iceConnectionState;
  const u=()=>{if(pcall===c){ice=q.iceConnectionState;$('iceB').textContent='ICE: '+ice}};u();q.addEventListener('iceconnectionstatechange',u);
}
function chk(){const v=$('rv');if(v.videoWidth>0&&!v.paused){videoOk=true;$('vwait').classList.add('hide')}}
$('vwait').onclick=()=>{ensureAudio();$('rv').play().catch(()=>{});if(pump)pump.play().catch(()=>{});chk()};
function startHb(){
  clearInterval(hb);
  hb=setInterval(()=>{
    send(pconn,{type:'ping'});chk();
    if(Date.now()-lastHb>6000){if(!lost)setLost(true);retry()}
    // PeerJS uses a separate RTCPeerConnection for media, so data can work while video does not
    if(ice==='failed'){if(!lost)setLost(true);retry(true)}
    if(!videoOk){
      $('vwait').classList.remove('hide');
      if(Date.now()-callAt>8000)$('vmsg').textContent=t('vNo')+' '+ice;
      if(Date.now()-callAt>15000)retry(true);
    }
  },2000);
}
function retry(keep){
  if(!peer||peer.destroyed||Date.now()-lastTry<5000)return;
  lastTry=Date.now();
  if(peer.disconnected){peer.reconnect();return}
  dial(!!(keep&&pconn&&pconn.open&&Date.now()-lastHb<6000));
}
function setLost(l){
  if(l===lost)return;lost=l;
  $('lost').classList.toggle('hide',!l);$('frame').classList.toggle('alert',l);
  clearInterval(lostT);
  if(l){setStatus(t('stLost'),'bad');const f=()=>{beep(440,330,.25,'sawtooth');if(navigator.vibrate)navigator.vibrate(400)};f();lostT=setInterval(f,3000);notify(t('stLost'))}
  else setStatus(t('stLive'),'ok');
}
function onData(m){
  if(!m)return;lastHb=Date.now();if(lost)setLost(false);
  if(m.type==='lvl'){rLevel=m.v||0;lvAt=Date.now()}
  else if(m.type==='st'){
    $('bN').classList.toggle('hide',!m.night);$('bD').classList.toggle('hide',!m.dim);$('bS').classList.toggle('hide',m.sound==='off');
    if(m.sound)$('rsnd').value=m.sound;battery(m.bat);
  }
}
function battery(b){
  if(!b)return;const e=$('rbat');
  e.textContent=b.c?'⚡':(b.e?'~':'')+b.l+'%';e.className='badge'+(!b.c&&b.l<=20?' bad':'');
  if(!b.c&&b.l<=15&&!lowShown){lowShown=true;note(t('lowBat'),'bad');beep(440,330,.25,'sawtooth');notify(t('lowBat'))}
  if(b.c||b.l>25)lowShown=false;
}

/* audio: direct playback (<=100%) + compressed extra gain above 100% */
function wire(s){
  if(!s.getAudioTracks().length)return;
  const c=ensureAudio(),as=new MediaStream(s.getAudioTracks());
  if(!pump){pump=new Audio();pump.autoplay=true;pump.playsInline=true}
  pump.srcObject=as;pump.play().catch(()=>$('unlock').classList.remove('hide'));
  try{src&&src.disconnect()}catch(e){}
  src=c.createMediaStreamSource(as);
  if(!an){an=c.createAnalyser();an.fftSize=512;gn=c.createGain();comp=c.createDynamicsCompressor();gn.connect(comp);comp.connect(c.destination)}
  src.connect(an);src.connect(gn);applyAudio();
  if(!loopOn){loopOn=true;setInterval(tick,100)}   // timers, not rAF: keeps alarming in background tabs
}
function applyAudio(){
  const g=gain/100;
  if(pump){pump.muted=muted||g===0;pump.volume=Math.min(1,g)}
  if(gn)gn.gain.value=(muted||g<=1)?0:g-1;
}
function updateMute(){$('mute').textContent=muted?t('spkOff'):t('spkOn')}
$('unlock').onclick=()=>{ensureAudio();if(pump)pump.play().catch(()=>{});$('unlock').classList.add('hide')};
$('gain').oninput=e=>{gain=+e.target.value;$('gv').textContent=gain+'%';applyAudio()};
$('mute').onclick=()=>{muted=!muted;applyAudio();updateMute()};
$('thr').oninput=e=>{thr=+e.target.value;$('tv').textContent=thr+'%';$('tm').style.left=thr+'%'};

/* detection: alarm only on sustained sound (>=8 of the last 20 samples = 0.8 s of 2 s) */
function tick(){
  an.getByteTimeDomainData(td);let s=0;for(const x of td){const n=(x-128)/128;s+=n*n}
  const r=Date.now()-lvAt<600?rLevel:0;
  const lv=Math.max(Math.min(100,Math.round(Math.sqrt(s/td.length)*320)),r);
  $('pbar').style.width=lv+'%';$('plv').textContent=lv+'%';
  $('pbar').style.background=lv>=thr?'var(--bad)':lv>thr*.7?'var(--warn)':'var(--ok)';
  hist.push(lv>=thr);if(hist.length>20)hist.shift();
  if(!alarmOn&&hist.filter(Boolean).length>=8)raise(lv);
}
function raise(lv){
  alarmOn=true;alarmN=0;hist.length=0;lastSet=true;
  $('last').textContent=lv+'% @ '+new Date().toLocaleTimeString();
  $('alarm').classList.remove('hide');$('frame').classList.add('alert');document.title='🔔 BrowserBabyAlarm';
  const f=()=>{if($('beep').checked)beep(587,880,Math.min(.6,.12+alarmN*.05));alarmN++;if(navigator.vibrate)navigator.vibrate([300,150,300])};
  f();alarmT=setInterval(f,2000);notify(t('alT'));   // repeats and gets louder until dismissed
}
$('dis').onclick=()=>{
  alarmOn=false;clearInterval(alarmT);hist.length=0;document.title='BrowserBabyAlarm';
  $('alarm').classList.add('hide');if(!lost)$('frame').classList.remove('alert');
};

/* remote control + push-to-talk (persistent intercom call, mic gated with track.enabled) */
$('rN').onclick=()=>send(pconn,{a:'night'});$('rD').onclick=()=>send(pconn,{a:'dim'});$('rF').onclick=()=>send(pconn,{a:'flip'});
$('rsnd').onchange=e=>send(pconn,{a:'sound',v:e.target.value});
$('fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen().catch(()=>{}):$('frame').requestFullscreen().catch(()=>{})};
async function pttStart(e){
  e.preventDefault();if(!peer||!target)return;
  try{
    if(!pttS){pttS=await navigator.mediaDevices.getUserMedia({audio:true});pttS.getTracks()[0].enabled=false}
    if(!pttC||!pttC.open)pttC=peer.call(target,pttS,{metadata:{type:'intercom'}});
    pttS.getTracks()[0].enabled=true;$('ptt').classList.add('on');$('ptt').textContent=t('pttOn');
  }catch(err){note(t('denied'),'bad')}
}
function pttStop(){
  if(pttS)pttS.getTracks()[0].enabled=false;
  $('ptt').classList.remove('on');$('ptt').textContent=t('ptt');
}
const pb=$('ptt');
pb.addEventListener('pointerdown',pttStart);
['pointerup','pointerleave','pointercancel'].forEach(ev=>pb.addEventListener(ev,pttStop));

/* ---------- init ---------- */
applyLang();setStatus(t('stIdle'),'mut');
if(joinCode)startParent();
</script>
